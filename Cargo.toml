[package]
name = "betelgeuse"
version = "0.1.0"
authors = ["Pekka Enberg"]
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A completion-based I/O library, designed as a foundation for deterministic simulation testing."

[lib]
path = "lib.rs"

[[example]]
name = "echo"
path = "examples/echo/main.rs"

[[example]]
name = "memcached"
path = "examples/memcached/main.rs"

[dependencies]
log = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
