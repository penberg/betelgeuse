[package]
name = "betelgeuse"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "A completion-based I/O library, designed as a foundation for deterministic simulation testing."

[lib]
path = "lib.rs"

[[example]]
name = "echo"
path = "examples/echo/main.rs"

[[example]]
name = "memcached"
path = "examples/memcached/main.rs"

[dependencies]
libc = "0.2"
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7.11"

[dev-dependencies]
proptest = "1"
tempfile = "3"
